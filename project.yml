# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
# The .xcodeproj is not committed; this file is the source of truth.
name: TakaDe
options:
  bundleIdPrefix: app.takade
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TakaDeKit:
    path: Packages/TakaDeKit
targets:
  TakaDe:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/TakaDe.xcconfig
      Release: Config/TakaDe.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: TakaDeKit
        product: TakaDeCore
      - package: TakaDeKit
        product: TakaDePersistence
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TakaDe
        CFBundleLocalizations: [en, bn]
        # takade://join?… opens a shared group's invite (docs/adr/0019-shared-groups.md);
        # takade://auth-callback is the sign-in return. Universal links on takadeapp.com
        # come later: they need the domain and a paid developer team (Associated Domains).
        CFBundleURLTypes:
          - CFBundleURLName: app.takade.links
            CFBundleURLSchemes: [takade]
        UILaunchScreen:
          UIColorName: launchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "TakaDe uses the camera to scan receipts and friends' TakaDe ID QR codes. A receipt photo stays with its expense; in a shared group it's encrypted before it's sent."
        NSContactsUsageDescription: TakaDe shows your contacts so you can search and pick people to add to a group. Only the names you pick are kept, on this phone. Your contacts are never uploaded.
        NSFaceIDUsageDescription: TakaDe uses Face ID to unlock the app when you turn on the lock in Settings. Your face data stays with iOS.
        # Google OAuth client for "Continue with Google"; empty hides the button (Config/Google.local.xcconfig).
        TakaDeGoogleClientID: $(TAKADE_GOOGLE_CLIENT_ID)
        TakaDeSupabaseHost: $(TAKADE_SUPABASE_HOST)
        TakaDeSupabaseAnonKey: $(TAKADE_SUPABASE_ANON_KEY)
        TakaDeMicrosoftSignIn: $(TAKADE_MICROSOFT_SIGN_IN)
        TakaDeEmailSignIn: $(TAKADE_EMAIL_SIGN_IN)
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, InterDisplay-SemiBold.ttf, HindSiliguri-Regular.ttf, HindSiliguri-Medium.ttf, HindSiliguri-SemiBold.ttf]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        # Sign in with Apple needs a paid developer team, so the entitlement is only on
        # Release builds. Debug builds signed with a free Apple ID still install on a phone.
        Release:
          CODE_SIGN_ENTITLEMENTS: App/TakaDe.entitlements
  # UI tests: accessibility audit and launch checks. See docs/testing.md.
  TakaDeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: TakaDe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.takade.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  TakaDe:
    build:
      targets:
        TakaDe: all
    test:
      gatherCoverageData: true
      targets:
        - TakaDeUITests
