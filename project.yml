# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
# The .xcodeproj is not committed; this file is the source of truth.
name: TakaDe
options:
  bundleIdPrefix: app.takade
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TakaDeKit:
    path: Packages/TakaDeKit
targets:
  TakaDe:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: TakaDeKit
        product: TakaDeCore
      - package: TakaDeKit
        product: TakaDePersistence
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TakaDe
        CFBundleLocalizations: [en, bn]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [Ranade-Medium.otf, Author-Regular.otf, Author-Medium.otf, Author-Semibold.otf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.takade.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  TakaDe:
    build:
      targets:
        TakaDe: all
    test:
      gatherCoverageData: true
