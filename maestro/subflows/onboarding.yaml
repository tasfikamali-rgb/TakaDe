# First launch: welcome, where you're from, language, account choice, name.
# Run after launchApp with clearState.
appId: app.takade.ios
---
- extendedWaitUntil:
    visible: "Get started"
    timeout: 20000
- tapOn: "Get started"
# Where you're from: the suggestion is already picked.
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "English"
    timeout: 5000
- tapOn: "English"
- takeScreenshot: ${OUT}/00a-onboarding-language
- tapOn: "Continue"
- takeScreenshot: ${OUT}/00b-onboarding-account
- tapOn: "Continue without account"
- tapOn: "Your name"
- inputText: "Sabit"
# Return submits the name (the field's onSubmit finishes onboarding). The button
# sits under the keyboard on small screens, so only tap it if it's still there.
- pressKey: Enter
- runFlow:
    when:
      visible: "Start splitting"
    commands:
      - tapOn: "Start splitting"
# iPad portrait starts with the sidebar hidden.
- runFlow:
    when:
      visible: "Show Sidebar"
    commands:
      - tapOn: "Show Sidebar"
- extendedWaitUntil:
    visible: "No groups yet"
    timeout: 10000
