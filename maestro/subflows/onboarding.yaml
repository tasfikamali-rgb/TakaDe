# First launch: language, account choice, name. Run after launchApp with clearState.
appId: app.takade.ios
---
- extendedWaitUntil:
    visible: "English"
    timeout: 20000
- tapOn: "English"
- tapOn: "Continue"
- tapOn: "Continue without account"
- tapOn: "Your name"
- inputText: "Sabit"
# Return submits the name (the field's onSubmit finishes onboarding). The button
# sits under the keyboard on small screens, so only tap it if it's still there.
- pressKey: Enter
- runFlow:
    when:
      visible: "Start splitting"
    commands:
      - tapOn: "Start splitting"
# iPad in portrait opens on the empty detail ("Pick a group") with the group list
# in a collapsed sidebar. Open it so the same steps work on phone and tablet.
- runFlow:
    when:
      visible: "Show Sidebar"
    commands:
      - tapOn: "Show Sidebar"
- extendedWaitUntil:
    visible: "No groups yet"
    timeout: 10000
