# The in-app language selector switches the interface to Bengali.
appId: app.takade.ios
name: Switch to Bengali
tags:
  - smoke
  - localization
---
- launchApp:
    clearState: true
- runFlow: ../subflows/onboarding.yaml
- tapOn: "Profile"
- takeScreenshot: ${OUT}/08-profile-en
- scrollUntilVisible:
    element: "বাংলা"
    direction: DOWN
- tapOn: "বাংলা"
# The selector must change the UI without a restart. "Profile" should be gone.
- assertNotVisible: "Profile"
- takeScreenshot: ${OUT}/09-profile-bn
- scrollUntilVisible:
    element: "English"
    direction: UP
- tapOn: "English"
- assertVisible: "Profile"
