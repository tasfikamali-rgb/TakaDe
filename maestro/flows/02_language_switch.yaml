# The in-app language selector switches the interface to Bengali.
appId: app.takade.ios
name: Switch to Bengali
tags:
  - smoke
  - localization
---
- launchApp:
    clearState: true
    # Pauses the moving background lines: Maestro waits for the screen to stop
    # moving before each step, so an endless animation made every step slow.
    arguments:
      holdTexture: "YES"
- runFlow: ../subflows/onboarding.yaml
# Settings opens from the gear on the Account tab.
- tapOn: "Account"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "বাংলা"
    direction: DOWN
- tapOn: "বাংলা"
# The selector must change the UI without a restart. "Settings" should be gone.
- assertNotVisible: "Settings"
- scrollUntilVisible:
    element: "English"
    direction: UP
- tapOn: "English"
- assertVisible: "Settings"
