# The in-app language selector switches the interface to Bengali.
appId: app.takade.ios
name: Switch to Bengali
tags:
  - smoke
  - localization
---
- launchApp:
    clearState: true
- runFlow: ../subflows/onboarding.yaml
- tapOn: "Settings"
- takeScreenshot: ${OUT}/08-settings-en
- scrollUntilVisible:
    element: "বাংলা"
    direction: DOWN
- tapOn: "বাংলা"
# The selector must change the UI without a restart. "Settings" should be gone.
- assertNotVisible: "Settings"
- takeScreenshot: ${OUT}/09-settings-bn
- scrollUntilVisible:
    element: "English"
    direction: UP
- tapOn: "English"
- assertVisible: "Settings"
