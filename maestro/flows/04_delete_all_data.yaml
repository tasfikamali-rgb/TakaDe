# "Delete all my data" removes groups, profile and settings from the phone and
# returns to first-launch onboarding. (App Store 5.1.1(v) and the Play data
# deletion policy expect a working in-app deletion path.)
appId: app.takade.ios
name: Delete all my data
tags:
  - privacy
---
- launchApp:
    clearState: true
- runFlow: ../subflows/onboarding.yaml
- tapOn: "Create a group"
- tapOn:
    id: "newGroup.name"
- inputText: "Trip"
# Your own name comes from onboarding; the new group never asks for it.
# Return in the group name moves to Add name (the field can sit under the keyboard,
# below the optional photo), then Add puts Rishan in the list.
- pressKey: Enter
- tapOn:
    id: "newGroup.memberName"
- inputText: "Rishan"
- pressKey: Enter
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Add expense"
    timeout: 10000
# On iPhone the tab bar hides inside a group; go back to reach the tabs.
- runFlow:
    when:
      visible: "Back"
    commands:
      - tapOn: "Back"
- tapOn: "Account"
- scrollUntilVisible:
    element: "Delete all my data"
    direction: DOWN
- tapOn: "Delete all my data"
- tapOn: "Delete everything"
# Back to first launch, and the group is gone.
- extendedWaitUntil:
    visible: "Get started"
    timeout: 10000
- runFlow: ../subflows/onboarding.yaml
- assertVisible: "No groups yet"
- assertNotVisible: "Trip"
