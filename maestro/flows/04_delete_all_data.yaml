# "Delete all my data" removes groups, profile and settings from the phone and
# returns to first-launch onboarding. (App Store 5.1.1(v) and the Play data
# deletion policy expect a working in-app deletion path.)
appId: app.takade.ios
name: Delete all my data
tags:
  - privacy
---
- launchApp:
    clearState: true
    # Pauses the moving background lines: Maestro waits for the screen to stop
    # moving before each step, so an endless animation made every step slow.
    arguments:
      holdTexture: "YES"
    # The new group adds people from Contacts; the simulator has Apple's sample
    # contacts (Kate Bell and others), so allow access up front.
    permissions:
      contacts: allow
- runFlow: ../subflows/onboarding.yaml
- tapOn: "Create a group"
- tapOn:
    id: "newGroup.name"
- inputText: "Trip"
# Your own name comes from onboarding; the new group never asks for it.
# Return in the group name moves to the people search (it can sit under the
# keyboard, below the optional photo). Typing finds the contact; tapping adds her.
- pressKey: Enter
- tapOn:
    id: "newGroup.memberSearch"
- inputText: "Kate"
# The search box scrolls to the top so matches sit above the keyboard; contacts
# load in the background, so wait for her row.
- extendedWaitUntil:
    visible: "Add Kate Bell"
    timeout: 10000
- tapOn: "Add Kate Bell"
# Her row goes in "Who's in it", above the search: scroll up until it shows.
- scrollUntilVisible:
    element: "From contacts"
    direction: UP
    timeout: 10000
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Add expense"
    timeout: 10000
# The tab bar hides inside a group on iPhone, so go back to the list first.
- runFlow:
    when:
      visible: "Back"
    commands:
      - tapOn: "Back"
- tapOn: "Account"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Delete all my data"
    direction: DOWN
- tapOn: "Delete all my data"
# Short centred Yes / No alerts; it asks a second time before wiping anything.
- assertVisible: "Delete all your data?"
- tapOn: "Yes"
- assertVisible: "Are you sure?"
- tapOn: "Yes"
# Back to first launch, and the group is gone.
- extendedWaitUntil:
    visible: "Get started"
    timeout: 10000
- runFlow: ../subflows/onboarding.yaml
- assertVisible: "No groups yet"
- assertNotVisible: "Trip"
