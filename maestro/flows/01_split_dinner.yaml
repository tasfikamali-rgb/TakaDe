# Core journey: create a group, add an expense with the keypad, open settle up.
# Taps by visible text so the same flow can run on Android once it exists
# (Android needs its own appId; see maestro/README.md).
appId: app.takade.ios
name: Split a dinner
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "No groups yet"
    timeout: 20000
- takeScreenshot: ${OUT}/01-groups-empty
- tapOn: "Create a group"
- tapOn: "Group name, like Cox's Bazar trip"
- inputText: "Sajek trip"
- tapOn: "Your name"
- inputText: "Sabit"
- tapOn: "Name"
- inputText: "Rishan"
- hideKeyboard
- takeScreenshot: ${OUT}/02-new-group
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Add expense"
    timeout: 10000
- takeScreenshot: ${OUT}/03-group
- tapOn: "Add expense"
- tapOn: "Amount"
- tapOn: "1"
- tapOn: "2"
- tapOn: "0"
- tapOn: "0"
- takeScreenshot: ${OUT}/04-keypad
- tapOn: "Done"
- tapOn: "What was it for?"
- inputText: "Dinner"
- hideKeyboard
- takeScreenshot: ${OUT}/05-add-expense
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Dinner"
    timeout: 10000
- takeScreenshot: ${OUT}/06-group-with-expense
- tapOn: "Settle up"
- takeScreenshot: ${OUT}/07-settle-up
