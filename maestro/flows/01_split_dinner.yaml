# Core journey: create a group, add an expense with the keypad, open settle up.
# Taps by visible text so the same flow can run on Android once it exists
# (Android needs its own appId; see maestro/README.md).
appId: app.takade.ios
name: Split a dinner
tags:
  - smoke
---
- launchApp:
    clearState: true
    # Pauses the moving background lines: Maestro waits for the screen to stop
    # moving before each step, so an endless animation made every step slow.
    arguments:
      holdTexture: "YES"
    # The new group adds people from Contacts; the simulator has Apple's sample
    # contacts (Kate Bell and others), so allow access up front.
    permissions:
      contacts: allow
- runFlow: ../subflows/onboarding.yaml
- tapOn: "Create a group"
- tapOn:
    id: "newGroup.name"
- inputText: "Sajek trip"
# Your own name comes from onboarding; the new group never asks for it.
# Return in the group name moves to the people search (it can sit under the
# keyboard, below the optional photo). Typing finds the contact; tapping adds her.
- pressKey: Enter
- tapOn:
    id: "newGroup.memberSearch"
- inputText: "Kate"
# The search box scrolls to the top so matches sit above the keyboard; contacts
# load in the background, so wait for her row.
- extendedWaitUntil:
    visible: "Add Kate Bell"
    timeout: 10000
- tapOn: "Add Kate Bell"
# Her row goes in "Who's in it", above the search: scroll up until it shows.
- scrollUntilVisible:
    element: "From contacts"
    direction: UP
    timeout: 10000
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Add expense"
    timeout: 10000
- tapOn: "Add expense"
# A new expense starts on Scan receipt, From photos and Enter amount.
- tapOn: "Enter amount"
- extendedWaitUntil:
    visible: "Done"
    timeout: 5000
- tapOn: "1"
- tapOn: "2"
- tapOn: "0"
- tapOn: "0"
- tapOn: "Done"
- tapOn: "What was it for?"
- inputText: "Dinner"
# A tap on Save while the predictions bar updates was sometimes lost, so if the
# sheet is still open, tap Save once more. "Dinner" is also in the open form, so
# wait for Settle up, which only shows on the group page once the debt exists.
# (hideKeyboard isn't used: iPad's keyboard can't always be hidden that way.)
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Settle up"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "What was it for?"
    commands:
      - tapOn: "Save"
- extendedWaitUntil:
    visible: "Settle up"
    timeout: 10000
- tapOn: "Settle up"
