# Core journey: create a group, add an expense with the keypad, open settle up.
# Taps by visible text so the same flow can run on Android once it exists
# (Android needs its own appId; see maestro/README.md).
appId: app.takade.ios
name: Split a dinner
tags:
  - smoke
---
- launchApp:
    clearState: true
- runFlow: ../subflows/onboarding.yaml
- tapOn: "Create a group"
- tapOn: "Group name"
- inputText: "Sajek trip"
# "Your name" is prefilled from onboarding.
- tapOn: "Name"
- inputText: "Rishan"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Add expense"
    timeout: 10000
- tapOn: "Add expense"
# The keypad opens by itself when the amount is empty.
- extendedWaitUntil:
    visible: "Done"
    timeout: 5000
- tapOn: "1"
- tapOn: "2"
- tapOn: "0"
- tapOn: "0"
- tapOn: "Done"
- tapOn: "What was it for?"
- inputText: "Dinner"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Dinner"
    timeout: 10000
- tapOn: "Settle up"
