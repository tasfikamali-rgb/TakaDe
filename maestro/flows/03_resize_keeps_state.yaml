# HIG (iPhone Duo, iPad, split view): "Keep functionality and the state of
# elements the same between displays." Rotating changes the width the same way
# folding does, so the open group and its data must survive it. A new group has
# no debts, so it shows "Add expense" (not "Settle up").
appId: app.takade.ios
name: Rotate keeps the open group
tags:
  - adaptive
---
- launchApp:
    clearState: true
    # Pauses the moving background lines: Maestro waits for the screen to stop
    # moving before each step, so an endless animation made every step slow.
    arguments:
      holdTexture: "YES"
    # The new group adds people from Contacts; the simulator has Apple's sample
    # contacts (Kate Bell and others), so allow access up front.
    permissions:
      contacts: allow
- runFlow: ../subflows/onboarding.yaml
- tapOn: "Create a group"
- tapOn:
    id: "newGroup.name"
- inputText: "Flat"
# Your own name comes from onboarding; the new group never asks for it.
# Return in the group name moves to the people search (it can sit under the
# keyboard, below the optional photo). Typing finds the contact; tapping adds her.
- pressKey: Enter
- tapOn:
    id: "newGroup.memberSearch"
- inputText: "Kate"
# The search box scrolls to the top so matches sit above the keyboard; contacts
# load in the background, so wait for her row.
- extendedWaitUntil:
    visible: "Add Kate Bell"
    timeout: 10000
- tapOn: "Add Kate Bell"
# Her row goes in "Who's in it", above the search; Create turns on once she's added.
- extendedWaitUntil:
    visible:
      text: "Create"
      enabled: true
    timeout: 10000
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Add expense"
    timeout: 10000
# iPhone stays upright (portrait only), so this rotation only changes iPad.
- setOrientation: LANDSCAPE_LEFT
- assertVisible: "Flat"
- assertVisible: "Add expense"
- setOrientation: PORTRAIT
- assertVisible: "Flat"
- assertVisible: "Add expense"
