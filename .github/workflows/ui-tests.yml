name: UI flows and screenshots

# Drives the real app with Maestro on an iPhone and an iPad simulator, in light
# and dark mode, and uploads the screenshots. Download them from the run page
# (Artifacts) instead of installing a simulator locally. See docs/testing.md.

# These use macOS runners, which count 10x against the private-repo free
# minutes, so they don't run on every push: they run on merge to main, by hand
# (Actions → UI flows and screenshots → Run workflow), or on a pull request when
# it gets the `ui-tests` label.
on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  # On main every merge gets a full run; on PRs a new push replaces the old run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    name: Build simulator app
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ui-tests')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('Packages/TakaDeKit/Package.swift') }}
      - run: scripts/ci/build-sim-app.sh
      # Tar keeps the executable bit, which upload-artifact drops.
      - run: tar -czf build/TakaDe.app.tgz -C build TakaDe.app
      - uses: actions/upload-artifact@v4
        with:
          name: TakaDe-simulator-app
          path: build/TakaDe.app.tgz
          retention-days: 7

  accessibility:
    name: Accessibility audit and launch tests
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ui-tests')
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('Packages/TakaDeKit/Package.swift') }}
      - name: Install XcodeGen and generate project
        run: brew install xcodegen && xcodegen generate --quiet
      - name: Build app and UI tests (simulator boots alongside)
        id: sim
        run: |
          # Booting takes ~3 minutes; do it while the build runs instead of before it.
          scripts/ci/boot-simulator.sh 'iPhone 16' > build-udid.txt &
          boot=$!
          xcodebuild build-for-testing \
            -project TakaDe.xcodeproj -scheme TakaDe \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -quiet
          wait $boot
          echo "udid=$(cat build-udid.txt)" >> "$GITHUB_OUTPUT"
      - name: Accessibility audit and launch tests
        run: |
          xcodebuild test-without-building \
            -project TakaDe.xcodeproj -scheme TakaDe \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/UITests.xcresult \
            -quiet
      - name: Show UI test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path build/UITests.xcresult --compact \
            | python3 scripts/ci/xcresult_failures.py
          # Screens where the audit named no element, printed as small base64 PNGs so
          # they can be read from the log (artifact downloads aren't always available).
          mkdir -p build/audit-shots
          xcrun xcresulttool export attachments --path build/UITests.xcresult \
            --output-path build/audit-shots >/dev/null 2>&1 || true
          scripts/ci/print_pngs.sh build/audit-shots
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: build/UITests.xcresult
          retention-days: 7

  flows:
    name: Maestro on ${{ matrix.device }} (${{ matrix.shard }})
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # One machine per device: the free plan runs only 5 Mac jobs at a time across the
      # repo, so more machines per run mostly means more waiting in the queue. Dark mode
      # re-runs only the main journey (the accessibility audit covers contrast), and
      # iPad runs the layout-sensitive flows.
      matrix:
        include:
          - { device: "iPhone 16", shard: "all", tags: "", dark: true }
          - { device: "iPad Pro 13-inch", shard: "layout", tags: "--include-tags adaptive,smoke", dark: false }
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - uses: actions/download-artifact@v4
        with:
          name: TakaDe-simulator-app
          path: build
      - name: Boot simulator, install Maestro and the app
        id: sim
        run: |
          # Boot in the background while Maestro downloads.
          scripts/ci/boot-simulator.sh "${{ matrix.device }}" > udid.txt &
          boot=$!
          tar -xzf build/TakaDe.app.tgz -C build
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          wait $boot
          udid=$(cat udid.txt)
          xcrun simctl install "$udid" build/TakaDe.app
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo '${{ matrix.device }}-${{ matrix.shard }}' | tr ' A-Z' '-a-z')" >> "$GITHUB_OUTPUT"
      - name: Flows in light mode
        run: |
          maestro --version
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance light
          out="maestro-results/${{ steps.sim.outputs.slug }}-light"
          mkdir -p "$out"
          maestro --device "${{ steps.sim.outputs.udid }}" test -e OUT="$out" ${{ matrix.tags }} --debug-output "$out/debug" \
            --format junit --output "$out/report.xml" maestro/flows
      - name: Main journey in dark mode
        if: matrix.dark && (success() || failure())
        run: |
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance dark
          out="maestro-results/${{ steps.sim.outputs.slug }}-dark"
          mkdir -p "$out"
          maestro --device "${{ steps.sim.outputs.udid }}" test -e OUT="$out" --debug-output "$out/debug" \
            --format junit --output "$out/report.xml" maestro/flows/01_split_dinner.yaml
      - name: Collect Maestro debug output
        if: failure()
        run: |
          cp -R "$HOME/.maestro/tests" maestro-results/debug 2>/dev/null || true
          # Each step of the failed flows, with its status and time taken.
          python3 scripts/ci/maestro_steps.py maestro-results "$HOME/.maestro/tests" || true
          # Maestro's own screenshot of the failed step, as a small base64 PNG.
          scripts/ci/print_pngs.sh maestro-results
          # What was on screen at the end of the last flow: visible texts and labels.
          maestro --device "${{ steps.sim.outputs.udid }}" hierarchy 2>/dev/null \
            | python3 -c 'import json,sys
          def walk(n):
              a = n.get("attributes", {})
              t = a.get("text") or a.get("accessibilityText") or a.get("hintText")
              if t: print("  -", t[:80])
              for c in n.get("children", []): walk(c)
          walk(json.load(sys.stdin))' || true
      - name: Upload debug output (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ steps.sim.outputs.slug }}
          path: maestro-results
          # Maestro writes under a hidden .maestro folder.
          include-hidden-files: true
          retention-days: 14

  iphone-duo:
    # Apple's iPhone Duo (HIG page added Sept 2026). Needs a newer Xcode than the
    # rest of CI; the job looks for the simulator and reports clearly when the
    # runner doesn't have it, rather than pretending it was tested.
    name: iPhone Duo (if the runner has it)
    needs: build
    # Started by hand only (Run workflow): GitHub's runners don't have this simulator
    # yet, and the job would otherwise hold one of the 5 Mac slots on every run.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Find iPhone Duo simulator
        id: duo
        run: |
          udid=$(scripts/ci/boot-simulator.sh "iPhone Duo" 2>/dev/null || true)
          if [ -z "$udid" ]; then
            type=$(xcrun simctl list devicetypes | grep -i "iPhone Duo" | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
            runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and x["platform"]=="iOS"]; print(r[-1]["identifier"] if r else "")')
            if [ -n "$type" ] && [ -n "$runtime" ]; then
              xcrun simctl create "iPhone Duo" "$type" "$runtime" >/dev/null
              udid=$(scripts/ci/boot-simulator.sh "iPhone Duo")
            fi
          fi
          if [ -z "$udid" ]; then
            echo "::warning title=iPhone Duo NOT tested::This runner's Xcode has no iPhone Duo simulator. Device types available:"
            xcrun simctl list devicetypes | grep -i iphone | tail -8
            echo "### iPhone Duo: NOT TESTED" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub runner's Xcode ($(xcodebuild -version | head -1)) has no iPhone Duo simulator." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "udid=$udid" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.duo.outputs.available == 'true'
        with:
          name: TakaDe-simulator-app
          path: build
      - name: Install Maestro and app
        if: steps.duo.outputs.available == 'true'
        run: |
          tar -xzf build/TakaDe.app.tgz -C build
          xcrun simctl install "${{ steps.duo.outputs.udid }}" build/TakaDe.app
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Flows on iPhone Duo (default pose), light and dark
        if: steps.duo.outputs.available == 'true'
        run: |
          for mode in light dark; do
            xcrun simctl ui "${{ steps.duo.outputs.udid }}" appearance $mode
            out="maestro-results/iphone-duo-$mode"; mkdir -p "$out"
            maestro --device "${{ steps.duo.outputs.udid }}" test -e OUT="$out" \
              --format junit --output "$out/report.xml" maestro/flows
          done
          echo "### iPhone Duo: tested in its default simulator pose" >> "$GITHUB_STEP_SUMMARY"
          echo "Folded/unfolded poses are switched in Xcode's Device Hub; there's no documented command-line switch yet, so the other pose is checked by hand." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug output (failures only)
        if: steps.duo.outputs.available == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-iphone-duo
          path: maestro-results
          retention-days: 14

  maestro-cloud:
    # Optional: runs the same flows on Maestro Cloud's device fleet in parallel.
    # Does nothing until the owner adds the MAESTRO_CLOUD_API_KEY and
    # MAESTRO_CLOUD_PROJECT_ID repository secrets (see docs/testing.md).
    name: Maestro Cloud (when configured)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
    steps:
      - name: Skip when not configured
        if: env.MAESTRO_CLOUD_API_KEY == ''
        run: echo "Maestro Cloud isn't set up yet (no MAESTRO_CLOUD_API_KEY secret)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.MAESTRO_CLOUD_API_KEY != ''
      - uses: actions/download-artifact@v4
        if: env.MAESTRO_CLOUD_API_KEY != ''
        with:
          name: TakaDe-simulator-app
          path: build
      - if: env.MAESTRO_CLOUD_API_KEY != ''
        run: tar -xzf build/TakaDe.app.tgz -C build
      - uses: mobile-dev-inc/action-maestro-cloud@v1
        if: env.MAESTRO_CLOUD_API_KEY != ''
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: ${{ secrets.MAESTRO_CLOUD_PROJECT_ID }}
          app-file: build/TakaDe.app
          workspace: maestro
